<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda | Catálogo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">

</head>

<body>
  <!-- Encabezado y navegación principal de la tienda. -->
  <header>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top navbar-personalizada">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#inicio">
          Fishing Shop
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <div class="navbar-nav ms-auto align-items-md-center">
            <a class="nav-link" href="#inicio">Inicio</a>
            <a class="nav-link" href="#catalogo">Productos</a>
            <a class="nav-link" href="#cuenta">Cuenta</a>
            <button id="boton-admin-nav" class="btn btn-sm btn-outline-light ms-md-2 d-none"
              type="button">Administración</button>
            <button id="boton-cerrar-sesion" class="btn btn-sm btn-warning ms-md-2 d-none" type="button">Cerrar
              sesión</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <!-- Presentación de bienvenida con acceso rápido al catálogo. -->
    <section id="inicio" class="py-5 hero-section">
      <div class="container text-center">
        <h1>Tu Lugar De Pesca</h1>
        <p class="lead">Equipo y accesorios para disfrutar cada jornada de pesca.</p>
        <a href="#catalogo" class="btn btn-success">
          Ver productos
        </a>
      </div>
    </section>

    <!-- Catálogo público: estado de carga, filtro de búsqueda y tarjetas de productos. -->
    <section id="catalogo" class="container py-5">
      <h2 class="text-center mb-4">
        Nuestros productos
      </h2>
      <div class="row align-items-center mb-3">
        <div class="col-md-8">
          <p id="mensaje-catalogo" class="text-secondary mb-0" role="status" aria-live="polite">
            Cargando productos...
          </p>
        </div>
        <div class="col-md-4 mt-2 mt-md-0"><input id="buscar-productos" class="form-control" type="search"
            placeholder="Buscar productos" aria-label="Buscar productos"></div>
      </div>
      <!-- JavaScript inserta aquí las tarjetas obtenidas desde la API. -->
      <div id="lista-productos" class="row g-4">

      </div>


    </section>

    <!-- Área de cuenta: los formularios de acceso o el perfil aparecen según la sesión. -->
    <section id="cuenta" class="container pb-5">
      <div class="row g-4">
        <!-- Formularios para iniciar sesión y registrar una cuenta común. -->
        <div id="panel-acceso" class="col-lg-6">
          <div class="card shadow-sm h-100">
            <div class="card-body p-4">
              <h2 class="h4 mb-3">Tu cuenta</h2>
              <ul class="nav nav-pills mb-3" role="tablist">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-login"
                    type="button">Iniciar sesión</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-registro"
                    type="button">Registrarme</button></li>
              </ul>
              <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-login">
                  <form id="form-login">
                    <label class="form-label" for="login-email">Email</label><input class="form-control mb-3"
                      id="login-email" type="email" required autocomplete="email">
                    <label class="form-label" for="login-password">Contraseña</label><input class="form-control mb-3"
                      id="login-password" type="password" required autocomplete="current-password">
                    <button class="btn btn-primary" type="submit">Ingresar</button>
                  </form>
                </div>
                <div class="tab-pane fade" id="tab-registro">
                  <form id="form-registro">
                    <label class="form-label" for="registro-nombre">Nombre</label><input class="form-control mb-3"
                      id="registro-nombre" required maxlength="100" autocomplete="name">
                    <label class="form-label" for="registro-email">Email</label><input class="form-control mb-3"
                      id="registro-email" type="email" required autocomplete="email">
                    <label class="form-label" for="registro-password">Contraseña (mínimo 6 caracteres)</label><input
                      class="form-control mb-3" id="registro-password" type="password" minlength="6" required
                      autocomplete="new-password">
                    <button class="btn btn-primary" type="submit">Crear cuenta</button>
                  </form>
                </div>
              </div>
              <p id="mensaje-cuenta" class="mt-3 mb-0" role="status" aria-live="polite"></p>
            </div>
          </div>
        </div>
        <!-- Formulario para modificar los datos del usuario autenticado. -->
        <div id="panel-perfil" class="col-lg-6 d-none">
          <div class="card shadow-sm h-100">
            <div class="card-body p-4">
              <h2 class="h4">Mi perfil</h2>
              <p id="perfil-rol" class="text-secondary"></p>
              <form id="form-perfil">
                <label class="form-label" for="perfil-nombre">Nombre</label><input class="form-control mb-3"
                  id="perfil-nombre" required maxlength="100">
                <label class="form-label" for="perfil-email">Email</label><input class="form-control mb-3"
                  id="perfil-email" type="email" required>
                <label class="form-label" for="perfil-foto">Foto (URL, opcional)</label><input class="form-control mb-3"
                  id="perfil-foto" type="url">
                <label class="form-label" for="perfil-password">Nueva contraseña (opcional)</label><input
                  class="form-control mb-3" id="perfil-password" type="password" minlength="6"
                  autocomplete="new-password">
                <button class="btn btn-primary" type="submit">Guardar perfil</button>
              </form>
              <p id="mensaje-perfil" class="mt-3 mb-0" role="status" aria-live="polite"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Panel exclusivo de administradores con pestañas para cada entidad gestionable. -->
    <section id="administracion" class="container pb-5 d-none">
      <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
        <div>
          <p class="eyebrow mb-1">PANEL ADMINISTRADOR</p>
          <h2 class="mb-0">Gestión de la tienda</h2>
        </div>
      </div>
      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#admin-productos"
            type="button">Productos</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-categorias"
            type="button">Categorías</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-usuarios"
            type="button">Usuarios</button></li>
      </ul>
      <div class="tab-content card card-body shadow-sm">
        <!-- Formulario de alta/edición y tabla de productos. -->
        <div id="admin-productos" class="tab-pane fade show active">
          <form id="form-producto" class="row g-3 mb-4">
            <input id="producto-id" type="hidden">
            <div class="col-md-6"><label class="form-label" for="producto-nombre">Nombre</label><input
                id="producto-nombre" class="form-control" required maxlength="100"></div>
            <div class="col-md-6"><label class="form-label" for="producto-imagen">Imagen (URL)</label><input
                id="producto-imagen" class="form-control" type="text" required></div>
            <div class="col-12"><label class="form-label" for="producto-descripcion">Descripción</label><textarea
                id="producto-descripcion" class="form-control" rows="2" required></textarea></div>
            <div class="col-md-4"><label class="form-label" for="producto-precio">Precio</label><input
                id="producto-precio" class="form-control" type="number" min="0" step="0.01" required></div>
            <div class="col-md-4"><label class="form-label" for="producto-stock">Stock</label><input id="producto-stock"
                class="form-control" type="number" min="0" step="1" required></div>
            <div class="col-md-4"><label class="form-label" for="producto-categoria">Categoría</label><select
                id="producto-categoria" class="form-select" required></select></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Guardar producto</button> <button
                id="cancelar-producto" class="btn btn-outline-secondary d-none" type="button">Cancelar edición</button>
            </div>
          </form>
          <div id="admin-lista-productos" class="table-responsive"></div>
        </div>
        <!-- Formulario de alta/edición y tabla de categorías. -->
        <div id="admin-categorias" class="tab-pane fade">
          <form id="form-categoria" class="row g-2 mb-4"><input id="categoria-id" type="hidden">
            <div class="col-md-8"><label class="form-label" for="categoria-nombre">Nombre de categoría</label><input
                id="categoria-nombre" class="form-control" required maxlength="100"></div>
            <div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary" type="submit">Guardar
                categoría</button> <button id="cancelar-categoria" class="btn btn-outline-secondary ms-2 d-none"
                type="button">Cancelar</button></div>
          </form>
          <div id="admin-lista-categorias" class="table-responsive"></div>
        </div>
        <!-- Tabla desde la que el administrador modifica o elimina usuarios. -->
        <div id="admin-usuarios" class="tab-pane fade">
          <div id="admin-lista-usuarios" class="table-responsive"></div>
        </div>
      </div>
      <p id="mensaje-admin" class="mt-3" role="status" aria-live="polite"></p>
    </section>
  </main>

  <!-- Ventana modal donde JavaScript muestra el detalle completo de un producto. -->
  <div class="modal fade" id="modal-producto" tabindex="-1" aria-labelledby="modal-producto-titulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-producto-titulo" class="modal-title h5"></h2><button class="btn-close" data-bs-dismiss="modal"
            aria-label="Cerrar"></button>
        </div>
        <div id="modal-producto-contenido" class="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- Pie de página de la tienda. -->
  <footer class="text-white text-center p-3 mt-auto">
    <div class="container">
      <p class="mb-0">Fishing Shop · WhatsApp (+598) 98-123-456</p>
    </div>
  </footer>




  <!-- Bootstrap aporta los componentes interactivos, como pestañas y ventanas modales. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lógica de catálogo, formularios de sesión y panel de administración. -->
  <script src="JS/main.js" defer></script>

</body>

</html>
